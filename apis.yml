aid: miri
name: Miri
description: Miri (Miri AI) is an AI-powered health and wellness engagement platform
  based in Oakland, California, that helps digital health, telehealth, GLP-1 and medical
  weight-loss, lab-diagnostics, and supplement companies increase patient retention
  and lifetime value. Miri sits between clinical touchpoints as a daily AI companion
  — logging meals via text or photo, tracking goals and body measurements, and running
  coach check-ins — while a behavioral-intelligence layer surfaces at-risk users and
  revenue opportunities. Developers embed Miri through a React Native Component SDK
  and a server-side, API-key-authenticated API with configurable webhooks for events
  such as meal logging, goal completion, profile updates, coach interactions, and push
  notifications. The developer program is currently in alpha.
